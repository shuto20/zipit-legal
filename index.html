<main><h1>旅行にも、ライブやお出かけにも。</h1>
<p>「Zipit（ジピット）」は、行き先の天気と予定から、足りない持ち物を AI が見つけるアプリです。広げた荷物を撮るか、持ち物を文章で書くだけで確かめられます。</p>
<ul>
<li>行き先は市町村名でも、東京ドームやテーマパークなどの施設名でも入力できます</li>
<li>日帰りのお出かけは、現地にいる時間帯の天気で判定します</li>
<li>家族の分も、行く人を選んでまとめて確かめられます</li>
</ul>
